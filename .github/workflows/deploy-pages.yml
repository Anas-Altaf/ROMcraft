name: Publish ROMcraft to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Validate and export static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Optional repo variable for custom domains; Settings > Secrets and variables > Actions > Variables
          SITE_URL_OVERRIDE: ${{ vars.ROMCRAFT_SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          base="${PAGES_BASE_PATH%/}"
          if [[ -n "$base" && "$base" != /* ]]; then echo "Invalid base path: $base" >&2; exit 1; fi
          if [[ -n "${SITE_URL_OVERRIDE:-}" ]]; then
            site_url="${SITE_URL_OVERRIDE%/}"
          else
            site_url="https://${owner}.github.io${base}"
          fi
          echo "Deploying with base path '${base}' and canonical URL '${site_url}'"
          NEXT_PUBLIC_BASE_PATH="$base" NEXT_PUBLIC_SITE_URL="$site_url" npm run verify
          test -f out/index.html
          test -f out/404.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/feed.xml
          test -f out/og-card.png
          touch out/.nojekyll
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
