name: Website bug
description: Report a navigation, layout, search or accessibility issue.
title: "[Site] "
labels: [website]
body:
  - type: input
    id: route
    attributes:
      label: Page route
      placeholder: /devices/...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and viewport
